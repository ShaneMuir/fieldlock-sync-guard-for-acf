name: Mirror to Bitbucket

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/bitbucket_mirror
          chmod 600 ~/.ssh/bitbucket_mirror
          ssh-keyscan -t ed25519 bitbucket.org >> ~/.ssh/known_hosts

      - name: Push mirror to Bitbucket
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/bitbucket_mirror -o IdentitiesOnly=yes
        run: |
          git remote add bitbucket git@bitbucket.org:tribusdigital/fieldlock-sync-guard-for-acf.git
          git push --mirror bitbucket
